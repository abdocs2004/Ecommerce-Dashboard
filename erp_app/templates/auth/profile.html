{% extends 'layouts/base.html' %}
{% block title %}الملف الشخصي{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow border-0">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-4">الملف الشخصي</h4>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">الاسم</label>
            <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">البريد الإلكتروني</label>
            <input type="email" class="form-control" value="{{ user.email }}" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label">الجنس</label>
            <select name="gender" class="form-select">
              <option value="" {% if not user.gender %}selected{% endif %}>-- اختر --</option>
              <option value="male" {% if user.gender == 'male' %}selected{% endif %}>ذكر</option>
              <option value="female" {% if user.gender == 'female' %}selected{% endif %}>أنثى</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">رقم الهاتف</label>
            <input type="text" name="phone" class="form-control" value="{{ user.profile.phone if user.profile else '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label">العنوان</label>
            <textarea name="address" class="form-control" rows="2">{{ user.profile.address if user.profile else '' }}</textarea>
          </div>
          <button type="submit" class="btn btn-erp">حفظ التغييرات</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
